version: '3.8'

services:
  # Services d'infrastructure
  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker_volumes/minio/data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      
  minio-init:
    image: alpine:latest
    depends_on:
      - minio
    volumes:
      - ./docker_volumes/minio/init.sh:/init.sh
    entrypoint: /bin/sh
    command: -c "apk add --no-cache curl && wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/bin/mc && chmod +x /usr/bin/mc && chmod +x /init.sh && /init.sh"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    networks:
      - mlops-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0rc0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./docker_volumes/mlflow/data:/mlflow
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: /bin/sh -c "pip install boto3 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/"
    depends_on:
      - minio
    networks:
      - mlops-network

  # Microservices métier
  gateway-api:
    build:
      context: .
      dockerfile: microservices/gateway_api/Dockerfile
    container_name: mlops-gateway
    ports:
      - "8000:8000"
    environment:
      - PREDICTION_API_URL=http://prediction-api:8001
      - TRAINING_API_URL=http://training-api:8002
      - DATA_API_URL=http://data-api:8003
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-for-jwt-tokens}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-userpassword}
    volumes:
      - ./docker_volumes/gateway/logs:/app/logs
    depends_on:
      - prediction-api
      - training-api
      - data-api
    networks:
      - mlops-network

  prediction-api:
    build:
      context: .
      dockerfile: microservices/prediction_api/Dockerfile
    container_name: mlops-prediction
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./docker_volumes/prediction/logs:/app/logs
      - ./docker_volumes/prediction/models:/app/models_persistent
    depends_on:
      - mlflow
      - minio
    networks:
      - mlops-network

  training-api:
    build:
      context: .
      dockerfile: microservices/training_api/Dockerfile
    container_name: mlops-training
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - DATA_API_URL=http://data-api:8003
    volumes:
      - ./docker_volumes/training/logs:/app/logs
      - ./docker_volumes/training/models:/app/models
    depends_on:
      - mlflow
      - minio
      - data-api
    networks:
      - mlops-network

  data-api:
    build:
      context: .
      dockerfile: microservices/data_api/Dockerfile
    container_name: mlops-data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./docker_volumes/data/logs:/app/logs
      - ./docker_volumes/data/data:/app/data
    depends_on:
      - mlflow
      - minio
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
