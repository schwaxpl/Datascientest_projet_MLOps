version: '3.8'

services:
  # Services d'infrastructure
  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker_volumes/minio/data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      
  minio-init:
    image: alpine:latest
    depends_on:
      - minio
    volumes:
      - ./docker_volumes/minio/init.sh:/init.sh
    entrypoint: /bin/sh
    command: -c "apk add --no-cache curl && wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/bin/mc && chmod +x /usr/bin/mc && chmod +x /init.sh && /init.sh"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    networks:
      - mlops-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0rc0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./docker_volumes/mlflow/data:/mlflow
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: /bin/sh -c "pip install boto3 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/"
    depends_on:
      - minio
    networks:
      - mlops-network

  # Microservices métier
  gateway-api:
    image: ${DOCKERHUB_USERNAME:-chameldst}/dst-mlops-gateway_api:${GATEWAY_API_IMAGE_TAG:-latest}
    container_name: mlops-gateway
    ports:
      - "8000:8000"
    environment:
      - PREDICTION_API_URL=http://prediction-api:8001
      - TRAINING_API_URL=http://training-api:8002
      - DATA_API_URL=http://data-api:8003
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-for-jwt-tokens}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-userpassword}
    volumes:
      - ./docker_volumes/gateway/logs:/app/logs
    depends_on:
      - prediction-api
      - training-api
      - data-api
    networks:
      - mlops-network

  prediction-api:
    image: ${DOCKERHUB_USERNAME:-chameldst}/dst-mlops-prediction_api:${PREDICTION_API_IMAGE_TAG:-latest}
    container_name: mlops-prediction
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./docker_volumes/prediction/logs:/app/logs
    depends_on:
      - mlflow
      - minio
    networks:
      - mlops-network

  training-api:
    image: ${DOCKERHUB_USERNAME:-chameldst}/dst-mlops-training_api:${TRAINING_API_IMAGE_TAG:-latest}
    container_name: mlops-training
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - DATA_API_URL=http://data-api:8003
    volumes:
      - ./docker_volumes/training/logs:/app/logs
    depends_on:
      - mlflow
      - minio
      - data-api
    networks:
      - mlops-network

  data-api:
    image: ${DOCKERHUB_USERNAME:-chameldst}/dst-mlops-data_api:${DATA_API_IMAGE_TAG:-latest}
    container_name: mlops-data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./docker_volumes/data/logs:/app/logs
      - ./docker_volumes/data/data:/app/data
    depends_on:
      - mlflow
      - minio
    networks:
      - mlops-network
      
  # Services Airflow
  # Configuration commune pour les services Airflow
  x-airflow-common: &airflow-common
    image: apache/airflow:2.7.3-python3.10
    environment: &airflow-common-env
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=ZbQ2ng2SaOXuLtsOTA9qx3Db0G8EHVxT0q_OyCmsZcg=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - GATEWAY_API_URL=http://gateway-api:8000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
    volumes:
      - ./microservices/airflow_api/dags:/opt/airflow/dags
      - ./docker_volumes/airflow/logs:/opt/airflow/logs
      - ./docker_volumes/airflow/plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
      - mlops-network
    depends_on:
      - postgres
      - gateway-api

  # Base de données PostgreSQL pour Airflow
  postgres:
    image: postgres:15
    container_name: mlops-airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - ./docker_volumes/airflow/postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - mlops-network

  # Webserver Airflow
  airflow-webserver:
    <<: *airflow-common
    container_name: mlops-airflow-webserver
    command: >
      bash -c "pip install -r /opt/airflow/dags/requirements.txt && airflow webserver"
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Scheduler Airflow
  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops-airflow-scheduler
    command: >
      bash -c "pip install -r /opt/airflow/dags/requirements.txt && airflow scheduler"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Initialisation de la base de données Airflow
  airflow-init:
    <<: *airflow-common
    container_name: mlops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        
        # Wait for Postgres to be ready
        while ! pg_isready -h postgres -p 5432 -U airflow > /dev/null 2>&1; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5
        done
        
        pip install -r /opt/airflow/dags/requirements.txt
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

networks:
  mlops-network:
    driver: bridge
